name: Gateway Windows app

# Cantrip Gateway for Windows (Clients/CantripGatewayMac/windows). Cantrip for Windows, the host's
# own Windows app in windows/, is release-windows.yml.

on:
  push:
    branches: [main]
    paths: ["Clients/CantripGatewayMac/windows/**", ".github/workflows/gateway-windows.yml"]
  pull_request:
    paths: ["Clients/CantripGatewayMac/windows/**", ".github/workflows/gateway-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Clients/CantripGatewayMac/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Clients/CantripGatewayMac/windows/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: TLS-PSK smoke test (Electron's BoringSSL against OpenSSL)
        run: npx electron scripts/psk-smoke.cjs
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: CantripGateway-Setup-windows-x64
          path: Clients/CantripGatewayMac/windows/release/*.exe
          if-no-files-found: error
