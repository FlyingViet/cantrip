name: Hermes
options:
  bundleIdPrefix: com.itzhoang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9M3XNFG4J7"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.0.0"
  # On-device neural TTS (Qwen3-TTS on MLX). Device-only at runtime — MLX needs
  # real Apple Silicon; the Qwen engine is hidden behind the system-voice default.
  Qwen3TTS:
    url: https://github.com/AtomGradient/swift-qwen3-tts
    branch: main
targets:
  Hermes:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: AgentGateway   # App Store / TestFlight name (project stays "Hermes" internally)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Hermes uses the microphone for voice conversations with your agent."
        NSSpeechRecognitionUsageDescription: "Hermes transcribes your speech on-device so you can talk to your agent hands-free."
        # The gateway may be reached over the LAN (plain HTTP) as well as the Cloudflare tunnel (HTTPS).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: MarkdownUI
      - package: Qwen3TTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itzhoang.hermbot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
