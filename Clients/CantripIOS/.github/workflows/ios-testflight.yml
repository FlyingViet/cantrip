name: iOS · TestFlight
# Hermes (com.itzhoang.hermes) → App Store Connect / TestFlight.

# Manual only. Builds Hermes (native Xcode archive) and uploads it to TestFlight
# via the App Store Connect API. Nothing runs on push.
#
# Run it:  gh workflow run ios-testflight.yml -R FlyingViet/Hermes --ref master
#
# One-time setup this depends on: the 4 secrets below + an App Store Connect app
# record for com.itzhoang.hermes + a self-hosted runner registered to this repo.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Build notes (for your reference only — not sent to Apple)"
        required: false
        default: ""

env:
  SCHEME: Hermes
  PROJECT: Hermes.xcodeproj
  CONFIGURATION: Release
  TEAM_ID: "9M3XNFG4J7"
  # CFBundleVersion = 100000 + run number → strictly increasing (all ASC needs).
  BUILD_NUMBER_BASE: "100000"

jobs:
  testflight:
    # Self-hosted Apple Silicon Mac mini with Xcode 26. Shares the machine with
    # the Plexa / NetLib / PrivateLibViewer / Bass Compass runners — build serially
    # (concurrent codesign collides on the login keychain).
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          xcodebuild -version
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unlock login keychain
        run: |
          KC="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KC"
          security set-keychain-settings -lut 21600 "$KC"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}" | base64 --decode \
            > "$RUNNER_TEMP/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

      - name: Archive
        run: |
          BUILD_NUMBER=$(( BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER ))
          echo "Build number: $BUILD_NUMBER"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hermes.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export & upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hermes.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"

      - name: Clean up secrets on disk
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
